<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoiceKey</title>
<style>
  :root{
    --bg:#0f1420; --card:#1a2132; --card2:#222b40; --line:#2c3650;
    --txt:#e6ebf5; --dim:#8b96ad; --accent:#4f8ef7; --ok:#3ddc84; --warn:#f5b942;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:18px;background:var(--bg);color:var(--txt);
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-size:13px;line-height:1.5;
  }
  h1{font-size:19px;margin:0 0 2px;font-weight:650;letter-spacing:.4px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .card h2{font-size:13px;font-weight:600;margin:0 0 10px;color:var(--txt);display:flex;align-items:center;gap:6px}
  .card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)}
  .row:last-child{border-bottom:none}
  .row label{color:var(--dim);flex:0 0 auto}
  .row .val{flex:1;text-align:right;color:var(--txt)}
  input[type=text],input[type=number],select{
    background:var(--card2);border:1px solid var(--line);border-radius:6px;color:var(--txt);
    padding:5px 8px;font-size:13px;width:150px;text-align:right;outline:none;
  }
  input:focus,select:focus{border-color:var(--accent)}
  input[type=range]{width:170px;accent-color:var(--accent)}
  .switch{position:relative;width:42px;height:24px;flex:0 0 auto}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;transition:.15s;cursor:pointer}
  .slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#6b7790;border-radius:50%;transition:.15s}
  .switch input:checked + .slider{background:rgba(79,142,247,.25);border-color:var(--accent)}
  .switch input:checked + .slider:before{transform:translateX(18px);background:var(--accent)}
  .keys-capture{
    display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;
  }
  .cap{background:var(--card2);border:1px solid var(--line);border-radius:5px;padding:3px 9px;font-size:12px;font-weight:600;color:var(--txt)}
  .cap.rec{animation:pulse 1s infinite;border-color:var(--accent)}
  @keyframes pulse{50%{opacity:.5}}
  .btn{
    background:var(--accent);color:#fff;border:none;border-radius:7px;padding:7px 14px;
    font-size:13px;font-weight:600;cursor:pointer;transition:.12s;
  }
  .btn:hover{filter:brightness(1.1)}
  .btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--txt)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
  .stat{display:flex;align-items:center;gap:8px}
  .stat .k{color:var(--dim);min-width:70px}
  .led{width:10px;height:10px;border-radius:50%;background:#54607a;box-shadow:0 0 0 2px rgba(0,0,0,.2)}
  .led.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .led.press{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .meter{height:8px;background:var(--card2);border-radius:4px;position:relative;overflow:hidden;margin-top:6px}
  .meter .fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,var(--ok),var(--warn));transition:width .08s linear}
  .meter .thr{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--warn);opacity:.8}
  .hint{color:var(--dim);font-size:11.5px;margin-top:8px;line-height:1.55}
  .kbd-note{color:var(--warn);font-size:11.5px;margin-top:4px}
  .footer{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
  .badge{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:10px;background:rgba(79,142,247,.18);color:var(--accent);margin-left:6px;vertical-align:middle}
</style>
</head>
<body>
  <h1>VoiceKey <span class="badge">原生插件</span></h1>
  <div class="sub">检测到手机音频时自动按住绑定按键，联动微信输入法「按住说话」语音输入</div>

  <!-- 状态 -->
  <div class="card">
    <h2><span class="dot" style="background:var(--ok)"></span>实时状态</h2>
    <div class="status-grid">
      <div class="stat"><span class="k">音频流</span><span class="led" id="ledStream"></span><span id="txtStream">—</span></div>
      <div class="stat"><span class="k">按住状态</span><span class="led" id="ledPress"></span><span id="txtPress">—</span></div>
      <div class="stat"><span class="k">当前电平</span><span id="txtLevel">0.000</span></div>
      <div class="stat"><span class="k">按键</span><span id="txtKeys">—</span></div>
    </div>
    <div class="meter"><div class="fill" id="meterFill"></div><div class="thr" id="meterThr" style="left:1.5%"></div></div>
    <div class="hint">黄色竖线 = 触发阈值。电平超过阈值并持续一小段时间即开始按住。</div>
  </div>

  <!-- 绑定按键 -->
  <div class="card">
    <h2><span class="dot" style="background:var(--accent)"></span>绑定按键</h2>
    <div class="row">
      <label>触发组合键</label>
      <div class="keys-capture"><span id="keysDisplay"></span></div>
    </div>
    <div class="row">
      <label></label>
      <div style="display:flex;gap:8px">
        <button class="btn" id="btnCapture">录入按键</button>
        <button class="btn ghost" id="btnResetKeys">恢复 Ctrl+Win</button>
      </div>
    </div>
    <div class="hint" id="captureHint">点「录入按键」后按下你想用的组合键（例如按住 Ctrl 再按 Win），松开后自动保存。微信输入法默认是 Ctrl+Win。</div>
  </div>

  <!-- 参数 -->
  <div class="card">
    <h2><span class="dot" style="background:var(--warn)"></span>识别参数</h2>
    <div class="row"><label>启用插件</label>
      <span class="switch"><input type="checkbox" id="cfgEnabled"><span class="slider"></span></span></div>
    <div class="row"><label>语音电平阈值</label>
      <input type="number" id="cfgThreshold" min="0" max="1" step="0.001"></div>
    <div class="row"><label>静音判定 (ms)</label>
      <input type="number" id="cfgSilenceMs" min="100" max="10000" step="50"></div>
    <div class="row"><label>最短按住 (ms)</label>
      <input type="number" id="cfgMinHoldMs" min="0" max="5000" step="50"></div>
    <div class="row"><label>最长按住 (ms)</label>
      <input type="number" id="cfgMaxHoldMs" min="1000" max="600000" step="500"></div>
    <div class="row"><label>开始延迟 (ms)</label>
      <input type="number" id="cfgStartDelayMs" min="0" max="2000" step="10"></div>
    <div class="row"><label>冷却时间 (ms)</label>
      <input type="number" id="cfgCooldownMs" min="0" max="5000" step="50"></div>
    <div class="row"><label>按键注入方式</label>
      <select id="cfgInjectMode">
        <option value="vk">虚拟键码 (VK)</option>
        <option value="scan">扫描码 (ScanCode)</option>
      </select></div>
    <div class="row"><label>仅在音频流时触发</label>
      <span class="switch"><input type="checkbox" id="cfgOnlyWhenStreaming"><span class="slider"></span></span></div>
  </div>

  <div class="footer">
    <button class="btn ghost" id="btnTest">测试按住一次</button>
    <button class="btn" id="btnSave">保存设置</button>
  </div>
  <div class="hint" id="msg"></div>

<script>
(function(){
  "use strict";
  var reqId = 0, pending = {};
  function call(api, args){
    return new Promise(function(resolve, reject){
      var id = ++reqId;
      pending[id] = {resolve:resolve, reject:reject};
      parent.postMessage({__micyou:1, id:id, api:api, args:args||{}}, '*');
      setTimeout(function(){
        if(pending[id]){ delete pending[id]; reject(new Error('timeout: '+api)); }
      }, 8000);
    });
  }
  window.addEventListener('message', function(e){
    var d = e.data;
    if(!d || d.__micyou !== 1 || !d.id) return;
    var p = pending[d.id];
    if(!p) return;
    delete pending[d.id];
    if(d.ok) p.resolve(d.value); else p.reject(new Error(d.error||'error'));
  });

  var cfgKeys = ["enabled","keys","threshold","silenceMs","minHoldMs","maxHoldMs",
                 "startDelayMs","cooldownMs","mode","injectMode","onlyWhenStreaming"];
  var cfg = {};

  function $(id){ return document.getElementById(id); }
  function showMsg(t, err){ $("msg").textContent = t; $("msg").style.color = err ? "#f56" : "var(--ok)"; }

  // 显示组合键
  function prettifyKeys(k){
    if(!k) return [];
    return k.split("+").map(function(s){
      s = s.trim().toLowerCase();
      var m = {ctrl:"Ctrl",control:"Ctrl",win:"Win",alt:"Alt",shift:"Shift",cmd:"Win",
               meta:"Win",space:"Space",enter:"Enter",tab:"Tab",esc:"Esc"};
      if(m[s]) return m[s];
      if(/^f\d+$/.test(s)) return s.toUpperCase();
      return s.toUpperCase();
    });
  }
  function renderKeysDisplay(k){
    var box = $("keysDisplay");
    box.innerHTML = "";
    prettifyKeys(k).forEach(function(name){
      var sp = document.createElement("span");
      sp.className = "cap"; sp.textContent = name; box.appendChild(sp);
    });
    $("txtKeys").textContent = prettifyKeys(k).join(" + ") || "—";
  }

  // ── 读取配置 ─────────────────────────────────
  async function loadConfig(){
    try{
      var v = await call("get_config");
      if(v && typeof v === "object"){ cfg = v; }
    }catch(e){ /* 使用默认 */ }
    applyUi();
  }
  function applyUi(){
    $("cfgEnabled").checked = cfg.enabled !== false;
    $("cfgThreshold").value = num(cfg.threshold, 0.015);
    $("cfgSilenceMs").value = num(cfg.silenceMs, 1000);
    $("cfgMinHoldMs").value = num(cfg.minHoldMs, 700);
    $("cfgMaxHoldMs").value = num(cfg.maxHoldMs, 60000);
    $("cfgStartDelayMs").value = num(cfg.startDelayMs, 120);
    $("cfgCooldownMs").value = num(cfg.cooldownMs, 800);
    $("cfgInjectMode").value = cfg.injectMode || "vk";
    $("cfgOnlyWhenStreaming").checked = cfg.onlyWhenStreaming !== false;
    renderKeysDisplay(cfg.keys || "ctrl+win");
    var thr = num(cfg.threshold, 0.015);
    $("meterThr").style.left = Math.min(100, Math.max(0, thr*100)) + "%";
  }
  function num(v, d){ var n = parseFloat(v); return isNaN(n) ? d : n; }

  // ── 保存配置 ─────────────────────────────────
  async function saveConfig(){
    var next = {
      enabled: $("cfgEnabled").checked,
      keys: cfg.keys || "ctrl+win",
      threshold: num($("cfgThreshold").value, 0.015),
      silenceMs: num($("cfgSilenceMs").value, 1000),
      minHoldMs: num($("cfgMinHoldMs").value, 700),
      maxHoldMs: num($("cfgMaxHoldMs").value, 60000),
      startDelayMs: num($("cfgStartDelayMs").value, 120),
      cooldownMs: num($("cfgCooldownMs").value, 800),
      mode: cfg.mode || "hold",
      injectMode: $("cfgInjectMode").value,
      onlyWhenStreaming: $("cfgOnlyWhenStreaming").checked
    };
    try{
      for(var i=0;i<cfgKeys.length;i++){
        var k = cfgKeys[i];
        await call("set_config", {key:k, value:next[k]});
      }
      cfg = next;
      applyUi();
      showMsg("已保存");
    }catch(e){ showMsg("保存失败："+e.message, true); }
  }

  // ── 按键录入 ─────────────────────────────────
  var capturing = false, captured = {};
  var MODIFIER_VK = {
    16:"shift", 17:"ctrl", 18:"alt", 91:"win", 92:"win"
  };
  var VK_NAME = {
    32:"space", 13:"enter", 9:"tab", 27:"esc",
    192:"`", 219:"[", 220:"\\", 221:"]", 186:";", 222:"'", 188:",", 190:".", 191:"/", 189:"-", 187:"=",
    8:"backspace", 46:"delete", 45:"insert", 36:"home", 35:"end", 33:"pageup", 34:"pagedown",
    37:"left", 38:"up", 39:"right", 40:"down"
  };
  function vkToName(code){
    if(MODIFIER_VK[code]) return MODIFIER_VK[code];
    if(VK_NAME[code]) return VK_NAME[code];
    if(code>=112 && code<=123) return "f"+(code-111); // F1..F12
    if(code>=65 && code<=90) return String.fromCharCode(code).toLowerCase();
    if(code>=48 && code<=57) return String.fromCharCode(code);
    if(code>=96 && code<=105) return "num"+(code-96);
    return "vk"+code;
  }
  var MOD_ORDER = {ctrl:0, alt:1, shift:2, win:3};
  function buildKeysString(){
    var names = Object.keys(captured);
    names.sort(function(a,b){
      var oa = MOD_ORDER[a], ob = MOD_ORDER[b];
      if(oa!=null && ob!=null) return oa-ob;
      if(oa!=null) return -1;
      if(ob!=null) return 1;
      return a < b ? -1 : 1;
    });
    return names.join("+");
  }
  function startCapture(){
    capturing = true; captured = {};
    $("btnCapture").textContent = "请按下组合键…";
    $("btnCapture").classList.add("cap","rec");
    $("captureHint").textContent = "正在录入：先按住修饰键，再按主键，然后全部松开。";
    renderCapture();
  }
  function renderCapture(){
    var box = $("keysDisplay"); box.innerHTML = "";
    var names = Object.keys(captured);
    if(!names.length){
      var sp = document.createElement("span"); sp.className="cap rec"; sp.textContent="…"; box.appendChild(sp); return;
    }
    names.forEach(function(n){ var s=document.createElement("span"); s.className="cap"; s.textContent=n.toUpperCase(); box.appendChild(s); });
  }
  window.addEventListener("keydown", function(e){
    if(!capturing) return;
    e.preventDefault(); e.stopPropagation();
    var name = vkToName(e.keyCode || e.which);
    captured[name] = true;
    renderCapture();
  }, true);
  window.addEventListener("keyup", function(e){
    if(!capturing) return;
    e.preventDefault(); e.stopPropagation();
    // 所有按键松开后结束录入
    var anyDown = false;
    // 简化：keyup 时若已有主键（非纯修饰）或按下过任意键，就结束
    capturing = false;
    $("btnCapture").textContent = "录入按键";
    $("btnCapture").classList.remove("cap","rec");
    var ks = buildKeysString();
    if(ks){
      cfg.keys = ks;
      renderKeysDisplay(ks);
      $("captureHint").textContent = "已录入：" + prettifyKeys(ks).join(" + ") + "。记得点「保存设置」。";
    } else {
      $("captureHint").textContent = "未识别到按键，请重试。";
      renderKeysDisplay(cfg.keys || "ctrl+win");
    }
  }, true);

  // ── 实时状态轮询 ─────────────────────────────
  async function pollState(){
    try{
      var v = await call("get_config");
      var probe = (v && v.lastProbe) || {};
      var streaming = !!probe.streaming;
      var pressed = !!probe.pressed;
      var level = num(probe.level, 0);
      $("ledStream").className = "led" + (streaming ? " on" : "");
      $("txtStream").textContent = streaming ? "活动中" : "空闲";
      $("ledPress").className = "led" + (pressed ? " press" : "");
      $("txtPress").textContent = pressed ? "正在按住" : "未按住";
      $("txtLevel").textContent = level.toFixed(3);
      $("meterFill").style.width = Math.min(100, level*100) + "%";
      if(probe.keys){ $("txtKeys").textContent = prettifyKeys(probe.keys).join(" + "); }
    }catch(e){ /* ignore */ }
  }

  // ── 事件绑定 ─────────────────────────────────
  $("btnCapture").addEventListener("click", startCapture);
  $("btnResetKeys").addEventListener("click", function(){
    cfg.keys = "ctrl+win"; renderKeysDisplay(cfg.keys);
    $("captureHint").textContent = "已恢复为 Ctrl+Win。记得点「保存设置」。";
  });
  $("btnSave").addEventListener("click", saveConfig);
  $("btnTest").addEventListener("click", async function(){
    try{ await call("trigger", {action:"test"}); showMsg("已触发一次测试按住"); }
    catch(e){ showMsg("测试失败："+e.message, true); }
  });
  $("cfgThreshold").addEventListener("input", function(){
    $("meterThr").style.left = Math.min(100, Math.max(0, num(this.value,0.015)*100)) + "%";
  });
  $("cfgEnabled").addEventListener("change", function(){ cfg.enabled = this.checked; });

  loadConfig();
  setInterval(pollState, 500);
})();
</script>
</body>
</html>
